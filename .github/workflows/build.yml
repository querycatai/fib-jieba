name: Build/release

on:
  push:
    # Sequence of patterns matched against refs/heads.  master is the branch of
    # this repository, so a push to it has to build (it did not, the workflow
    # only listened to dev and main).
    branches:
      - "master"
      - "main"
      - "dev"
    tags:
      - "*"
  pull_request:
    branches:
      - "master"
      - "main"
      - "dev"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # The loong64 images carry their own qemu and the runner cannot point its
    # binfmt handlers at them, so that job reports without gating.
    continue-on-error: ${{ startsWith(matrix.arch, 'loong64') }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: ia32
          - os: ubuntu-latest
            arch: arm64
          - os: ubuntu-latest
            arch: arm
          - os: ubuntu-latest
            arch: mips64
          - os: ubuntu-latest
            arch: ppc64
          - os: ubuntu-latest
            arch: riscv64
          - os: ubuntu-latest
            arch: loong64
          - os: ubuntu-latest
            target: alpine
            arch: x64
          - os: ubuntu-latest
            target: alpine
            arch: ia32
          - os: ubuntu-latest
            target: alpine
            arch: arm64
          - os: ubuntu-latest
            target: android
            arch: x64
          - os: ubuntu-latest
            target: android
            arch: ia32
          - os: ubuntu-latest
            target: android
            arch: arm64
          - os: ubuntu-latest
            target: android
            arch: arm
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: ia32
          - os: windows-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            target: iphone
            arch: arm64
          - os: macos-latest
            target: iphone
            arch: x64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup the environment
        shell: bash
        run: . ./fib-addon/build_tools/scripts/actions-env.sh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}

      - name: Build the project
        shell: bash
        run: |
          set -ev
          set -o pipefail
          # Reading the raw log of a failed job needs authentication; the report
          # step below turns the interesting lines into annotations, which can be
          # read through the API.
          bash build -j2 ${BUILD_ARCH} ${BUILD_TARGET} ${BUILD_TYPE} 2>&1 | tee build.log
          if [[ "$BUILD_TAG" != "" ]]; then
            tar -zcf ${BUILD_NAME}-${BUILD_TARGET}-${BUILD_ARCH}-${BUILD_TYPE}.tar.gz addon/${BUILD_NAME}.node
          fi

      - name: Release the project
        if: env.BUILD_TAG != ''
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.BUILD_NAME }}-${{ env.BUILD_TARGET }}-${{ env.BUILD_ARCH }}-${{ env.BUILD_TYPE }}.tar.gz
          tag: ${{ env.BUILD_TAG }}
          overwrite: true

      # The raw log of a failed job needs authentication; these annotations can
      # be read through the API.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          PATTERN='error([ :]| C[0-9]{4})|fatal error|Error [0-9]+$|FAILED|LNK[0-9]{4}|MSB[0-9]{4}|make(\[[0-9]+\])?: \*\*\*'
          echo "::group::build.log (error lines)"
          grep -n -E "${PATTERN}" build.log | head -40 || true
          echo "::endgroup::"
          { grep -E "${PATTERN}" build.log | head -35 || true; tail -10 build.log; } \
            | while IFS= read -r line; do
                [ -n "${line}" ] && echo "::error::${line}"
              done
